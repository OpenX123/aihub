[package]
name = "aihub"
version = "0.3.0"
description = "把常用的 AI 聊天网站聚合到一个窗口里"
authors = ["Aihub contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "aihub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# multiwebview（一个窗口里挂多个 webview）到今天仍锁在 unstable 后面，
# 这个 app 的分屏就是靠它，所以必须开。副作用：Tauri 小版本升级可能破 API。
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"   # 体积优先：这个 app 的瓶颈从来不是 CPU
panic = "abort"
strip = true
