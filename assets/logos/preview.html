<script>
  const cards = [...document.querySelectorAll('.card')];
  const domesticKeys = new Set(["aicoding","aigocode","aihubmix","alibaba","apinebula","baidu","bailian","bytedance","byteplus","chatglm","claudecn","deepseek","doubao","huawei","hunyuan","huoshan","kimi","longcat","minimax","modelscope","newapi","packycode","ppio","qianwenai","qiniu","qwen","qwencloud","runapi","shengsuanyun","siliconflow","stepfun","sudocode","tencent","ucloud","wenxin","xiaomimimo","xycai","yi","zeroone","zhipu"]);
  const q = document.getElementById('q');
  const count = document.getElementById('count');
  let scope = 'all';
  function apply() {
    const term = q.value.trim().toLowerCase();
    let shown = 0;
    for (const card of cards) {
      const key = card.dataset.key.split(' ')[0];
      const scopeOk = scope === 'all' || (scope === 'domestic') === domesticKeys.has(key);
      const termOk = !term || card.dataset.key.toLowerCase().includes(term);
      const ok = scopeOk && termOk;
      card.classList.toggle('hide', !ok);
      if (ok) shown += 1;
    }
    count.textContent = shown + ' / ' + cards.length;
  }
  q.addEventListener('input', apply);
  for (const btn of document.querySelectorAll('.tab')) {
    btn.addEventListener('click', () => {
      scope = btn.dataset.scope;
      document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b === btn));
      apply();
    });
  }
  apply();
</script>
